[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ifquant-platform"
version = "0.1.0"
description = "QuPath-first, governed high-resolution tissue imaging and spatial phenotyping."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "IFQuant contributors" }]
dependencies = []

[project.optional-dependencies]
qc = [
  "numpy>=2.0",
  "Pillow>=11.0",
]
imaging = [
  "numpy>=2.0",
  "Pillow>=11.0",
  "tifffile>=2025.1",
  "zarr>=3.0",
]
wsi-codecs = ["imagecodecs>=2025.3"]
spatial = [
  "anndata>=0.12,<0.13",
  "h5py>=3.12",
  "scipy>=1.14",
]
spatialdata = [
  "ifquant-platform[spatial]",
  "spatialdata>=0.7,<0.8",
]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
ifquant-platform = "ifquant_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ifquant_platform"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
