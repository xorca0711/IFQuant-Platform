[project]
name = "ifquant-valis-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "valis-wsi==1.2.0",
  "numpy==1.26.4",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "pyvips[binary]==3.2.0",
  "pyvips-binary==8.18.7",
]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
